name: gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gate tests
        run: python3 scripts/test_gate.py
      - name: Frozen regression samples (other work packages pending)
        run: python3 scripts/test_regressions.py
        continue-on-error: true
      - name: Phase 1A status lifecycle
        run: python3 scripts/test_phase1a.py
      - name: Frozen Phase 2E tests
        run: python3 scripts/test_phase2e.py
      - name: RED-1 accepted note survives successful settle
        run: python3 scripts/test_regressions.py RegressionTests.test_red1_successful_settle_preserves_accepted_note
      - name: RED-2 old deposit survives failed settle
        run: python3 scripts/test_regressions.py RegressionTests.test_red2_failed_settle_preserves_all_existing_deposit_files
      - name: RED-10 third edit is locked
        run: python3 scripts/test_regressions.py RegressionTests.test_red10_third_consecutive_edit_is_locked_as_not_delivered
      - name: Phase 1B required regressions
        run: >-
          python3 -m unittest
          scripts.test_regressions.RegressionTests.test_red3_r02_cross_cue_window
          scripts.test_regressions.RegressionTests.test_red7_normal_imperative_openers_are_verbs
          scripts.test_regressions.RegressionTests.test_red11_chinese_number_without_transcript_support_fails_r07
      - name: RED-12 installation regression
        run: python3 scripts/test_regressions.py RegressionTests.test_red12_partial_install_reports_missing_script_file
      - name: No video-specific tokens
        run: python3 scripts/test_no_overfit.py
      - name: Claim grounding counts unit test
        run: python3 scripts/test_claim_ground_check.py
      - name: Coverage gate
        run: python3 scripts/test_coverage_check.py
      - name: Evidence fixtures
        run: python3 scripts/run_evidence.py --skip-live
      - name: Verify corpus
        run: python3 scripts/verify_report.py
      - name: Evidence stays clean
        run: |
          git diff --exit-code -- evals/results
          if [ -n "$(git status --porcelain -- evals/results)" ]; then
            git status --porcelain -- evals/results
            exit 1
          fi
