name: gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gate tests
        run: python3 scripts/test_gate.py
      - name: Evidence fixtures
        run: python3 scripts/run_evidence.py --skip-live
