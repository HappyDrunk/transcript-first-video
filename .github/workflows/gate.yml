name: gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gate tests
        run: python3 scripts/test_gate.py
      - name: No video-specific tokens
        run: python3 scripts/test_no_overfit.py
      - name: Claim grounding counts unit test
        run: python3 scripts/test_claim_ground_check.py
      - name: Evidence fixtures
        run: python3 scripts/run_evidence.py --skip-live
      - name: Verify corpus
        run: python3 scripts/verify_report.py
      - name: Evidence stays clean
        run: |
          git diff --exit-code -- evals/results
          if [ -n "$(git status --porcelain -- evals/results)" ]; then
            git status --porcelain -- evals/results
            exit 1
          fi
